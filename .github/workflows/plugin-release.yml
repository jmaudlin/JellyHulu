name: Plugin release

on:
  push:
    tags:
      - 'plugin-v*'
  # Also runnable by hand from the Actions tab. Tag-only would be tidier, but
  # it makes cutting a release impossible for anyone whose credentials can
  # push branches and not tags — which is a surprisingly common setup, and
  # leaves you with no way to publish at all.
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, e.g. 1.0.0.0 (a three-part version gets .0 appended)'
        required: true
        default: '1.0.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Derive the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw='${{ inputs.version }}'
          else
            raw="${GITHUB_REF_NAME#plugin-v}"
          fi

          # Jellyfin wants four parts; accept three and append .0.
          if ! printf '%s' "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::'$raw' is not a valid version (want 1.2.3 or 1.2.3.4)"
            exit 1
          fi
          if [ "$(printf '%s' "$raw" | awk -F. '{print NF}')" -eq 3 ]; then
            raw="$raw.0"
          fi

          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=plugin-v$raw" >> "$GITHUB_OUTPUT"
          echo "Releasing $raw as tag plugin-v$raw"

      - name: Build, test and package
        run: |
          npm run check
          dotnet test plugin/Jellyfin.Plugin.JellyHulu.Tests -c Release --nologo
          plugin/package.sh \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "See https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, so a manual run creates the tag at this commit rather
          # than needing one to already exist.
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            plugin/artifacts/*.zip
            plugin/artifacts/logo.png
            manifest.json
          body: |
            JellyHulu plugin ${{ steps.version.outputs.version }}.

            **Install:** add this repository URL in Jellyfin under
            Dashboard → Plugins → Repositories:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
            ```

            Then install **JellyHulu** from the catalogue.

      - name: Commit the updated manifest
        # The manifest carries the checksum of the archive just built, so it
        # has to be committed from the same run that produced it — a locally
        # generated manifest would not match CI's archive.
        #
        # This deliberately commits into a detached worktree of the target
        # branch rather than rebasing the release branch onto it. Rebasing
        # replays *every* commit since the merge base, so pushing the result
        # would land the whole release branch on the default branch — an
        # unreviewed merge dressed up as a manifest update. Only manifest.json
        # may travel here.
        run: |
          set -euo pipefail
          target="${{ github.event.repository.default_branch }}"

          if ! git fetch origin "$target"; then
            echo "::warning::could not fetch $target; manifest not committed"
            exit 0
          fi

          work="$(mktemp -d)"
          git worktree add --detach "$work" "origin/$target"
          cp manifest.json "$work/manifest.json"

          cd "$work"
          if git diff --quiet -- manifest.json; then
            echo "manifest.json on $target is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update the plugin manifest for ${{ steps.version.outputs.tag }}"

          # Never fail the run here: the release is already published, and
          # reporting failure would describe a broken release that succeeded.
          git push origin "HEAD:$target" \
            || echo "::warning::could not push the manifest to $target"
